[project]
name = "deltaomni"
version = "0.1.0"
description = "Independent modality delta codecs with typed interleaving and learned commit policies"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "av>=14,<16",
  "librosa==0.11.0",
  "numpy>=1.26,<3",
  "peft==0.17.1",
  "pillow>=11,<12",
  "py7zr==1.0.0",
  "pyyaml>=6,<7",
  "soundfile==0.13.1",
  "torch==2.6.0",
  "torchvision==0.21.0",
  "transformers==4.52.3",
]

[dependency-groups]
dev = [
  "jsonschema>=4,<5",
  "pytest>=8.3,<9",
  "ruff>=0.11,<0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
deltaomni-sanity = "deltaomni.train_sanity:main"
deltaomni-verify = "deltaomni.verify_sanity:main"
deltaomni-provenance = "deltaomni.provenance:main"
deltaomni-report = "deltaomni.report:main"
deltaomni-data-audit = "deltaomni.data.audit:main"
deltaomni-annotation-audit = "deltaomni.data.annotation_audit:main"
deltaomni-preprocess-nextqa = "deltaomni.data.preprocess_nextqa:main"
deltaomni-preprocess-ssv2 = "deltaomni.data.preprocess_ssv2:main"
deltaomni-preprocess-audioset-strong = "deltaomni.data.preprocess_audioset_strong:main"
deltaomni-preprocess-vggsound-s1 = "deltaomni.data.preprocess_vggsound_s1:main"
deltaomni-preprocess-audiocaps = "deltaomni.data.preprocess_audiocaps:main"
deltaomni-preprocess-clotho = "deltaomni.data.preprocess_clotho:main"
deltaomni-preprocess-msrvtt = "deltaomni.data.preprocess_msrvtt:main"
deltaomni-audit-longvideobench = "deltaomni.data.longvideobench:main"
deltaomni-preprocess-ego4d-goalstep = "deltaomni.data.preprocess_ego4d_goalstep:main"
deltaomni-backbone-smoke = "deltaomni.backbone_smoke:main"
deltaomni-language-smoke = "deltaomni.language_smoke:main"
deltaomni-omni-backbone-smoke = "deltaomni.omni_backbone_smoke:main"
deltaomni-cache-vggsound-s1 = "deltaomni.omni_vggsound_cache:main"
deltaomni-cache-audiocaps-prefix = "deltaomni.omni_audiocaps_prefix_cache:main"
deltaomni-cache-clotho-prefix = "deltaomni.omni_clotho_prefix_cache:main"
deltaomni-cache-nextqa-joint = "deltaomni.omni_nextqa_joint_cache:main"
deltaomni-cache-msrvtt-video = "deltaomni.omni_msrvtt_video_cache:main"
deltaomni-cache-ego4d-goalstep = "deltaomni.omni_ego4d_goalstep_cache:main"
deltaomni-train-nextqa-joint-head = "deltaomni.nextqa_joint_head_poc:main"
deltaomni-train-nextqa-video-lora = "deltaomni.nextqa_video_lora:main"
deltaomni-evaluate-omni-vanilla = "deltaomni.omni_vanilla_baseline:main"
deltaomni-analyze-omni-vanilla = "deltaomni.vanilla_control_analysis:main"
deltaomni-train-audiocaps-caption = "deltaomni.audiocaps_caption_lora:main"
deltaomni-evaluate-audiocaps-caption = "deltaomni.audiocaps_caption_eval:main"
deltaomni-train-msrvtt-raw-caption = "deltaomni.msrvtt_raw_caption_lora:main"
deltaomni-compare-msrvtt-raw-caption = "deltaomni.msrvtt_raw_caption_compare:main"
deltaomni-train-msrvtt-continuous-caption = "deltaomni.msrvtt_continuous_caption_lora:main"
deltaomni-train-streaming-commit = "deltaomni.streaming_commit_train:main"
deltaomni-train-deltatok-scale = "deltaomni.deltatok_scale_train:main"
deltaomni-evaluate-deltatok-scale = "deltaomni.deltatok_scale_eval:main"
deltaomni-ssv2-pilot = "deltaomni.ssv2_pilot:main"
deltaomni-ssv2-caption-pilot = "deltaomni.ssv2_caption_pilot:main"
deltaomni-audioset-timing-pilot = "deltaomni.audioset_timing_pilot:main"
deltaomni-nextqa-reconstruction-pilot = "deltaomni.nextqa_reconstruction_pilot:main"
deltaomni-ssv2-resampler-pilot = "deltaomni.ssv2_resampler_pilot:main"
deltaomni-ssv2-semantic-pilot = "deltaomni.ssv2_semantic_pilot:main"
deltaomni-delta-setting-sweep = "deltaomni.delta_setting_sweep:main"
deltaomni-ssv2-semantic-token-pilot = "deltaomni.ssv2_semantic_token_pilot:main"
deltaomni-ssv2-delta-search = "deltaomni.ssv2_delta_search:main"
deltaomni-ssv2-semantic-caption = "deltaomni.ssv2_semantic_caption_pilot:main"
[tool.hatch.build.targets.wheel]
packages = ["src/deltaomni"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
