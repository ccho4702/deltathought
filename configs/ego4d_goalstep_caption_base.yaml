seed: 42
modality: video
prefix_manifest: intermediates/cache/omni_ego4d_goalstep/manifest.json
omni_config: configs/qwen2_5_omni.yaml
runtime:
  device: cuda
  backend: nccl
  nccl_compatibility_mode: true
  precision: bfloat16
  cpu_threads: 4
  per_device_batch_size: 1
  gradient_accumulation_steps: 1
  cache_entries: 128
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules_regex: '^model\.layers\.\d+\.(self_attn\.(q_proj|k_proj|v_proj|o_proj)|mlp\.(gate_proj|up_proj|down_proj))$'
interface:
  delta_width: 768
  hidden_width: 3584
  delta_updates: 119
  max_target_tokens: 48
  system_prompt: You are an accurate video captioning assistant.
  user_prompt: Describe the visual event that just completed in one concise sentence.
training:
  lora_learning_rate: 0.00005
  interface_learning_rate: 0.0002
  weight_decay: 0.0001
  warmup_steps: 50
  max_steps: 400
  checkpoint_interval_steps: 50
  keep_last_checkpoints: 3
  gradient_clip_norm: 1.0
  resume: auto
evaluation:
  nll_batch_size: 1
  nll_examples: 64
  generation_examples: 64
  max_new_tokens: 32
  minimum_control_gap: 0.01
output_root: outputs/real_pilots/ego4d_goalstep_caption_base
log_root: logs/experiments
