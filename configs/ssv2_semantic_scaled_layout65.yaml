seed: 42
device: cuda:0
cpu_threads: 8
media_dir: /mnt/nfs_shared_data/dataset/ssv2/20bn-something-something-v2
access_mode: read_only_existing_shared_copy
train_annotations: /mnt/nfs_shared_data/dataset/ssv2/labels/train.json
validation_annotations: /mnt/nfs_shared_data/dataset/ssv2/labels/validation.json
classes:
  - Moving [something] down
  - Moving [something] up
  - Pushing [something] from left to right
  - Pushing [something] from right to left
train_per_class: 512
validation_per_class: 64
test_per_class: 64
frames_per_clip: 8
embedding_batch_size: 64
cache_root: intermediates/cache/ssv2_semantic_scaled
output_root: outputs/real_pilots/ssv2_scaled_layout65
model:
  embedding_dim: 768
  embedding_tokens: 257
  delta_tokens: 65
  hidden_dim: 256
  num_heads: 8
training:
  batch_size: 32
  learning_rate: 0.0001
  max_steps: 400
  checkpoint_interval_steps: 50
  max_grad_norm: 1.0
probe:
  steps: 300
  learning_rate: 0.01
  hidden_dim: 256
caption:
  prompt: "Classify the visual change. Answer with exactly one action label: "
  batch_size: 16
  targets:
    - "moving down"
    - "moving up"
    - "pushing left to right"
    - "pushing right to left"
  learning_rate: 0.001
  max_steps: 400
  checkpoint_interval_steps: 50
  ranking_weight: 1.0
  train_delta_encoder: true
  delta_learning_rate: 0.0001
  reconstruction_weight: 1.0
