runtime:
  device: cuda
  backend: nccl
  nccl_compatibility_mode: true
  cpu_threads: 4
  gradient_accumulation_steps: 2
  cache_entries: 128
training:
  learning_rate: 0.00003
  adapter_learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_steps: 20
  max_steps: 800
  checkpoint_interval_steps: 100
  keep_last_checkpoints: 8
  gradient_clip_norm: 1.0
  zero_ranking_weight: 0.5
  zero_ranking_margin: 0.1
  cross_ranking_weight: 0.5
