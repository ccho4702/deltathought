seed: 42
input_mode: delta
caption_config: configs/ego4d_goalstep_caption_base.yaml
prefix_manifest: intermediates/cache/omni_shot2story_smoke/manifest.json
initial_checkpoint: outputs/real_pilots/shot2story_caption_smoke/shot2story-caption-smoke-main/checkpoints/step-000040.pt
