  order_ranking_weight: 0.5
  order_ranking_margin: 0.1
  resume: auto
evaluation:
  windows: 16
  nll_windows: 16
  max_new_tokens: 32
  minimum_delta_gap: 0.005
  minimum_memory_gap: 0.001
  minimum_cross_gap: 0.001
  minimum_order_gap: 0.001
  minimum_negative_nll_gap: 0.005
output_root: outputs/real_pilots/shot2story_caption_overfit
log_root: logs/experiments
report_path: outputs/reports/shot2story_caption_overfit.json
