raw_root: /mnt/nfs_shared_data/dataset/deltathought/raw
canonical_root: intermediates/canonical
derived_root: intermediates/data
chunk_seconds: 1.0
sources:
  something_something_v2:
    enabled: true
    resource_name: something_something_v2
    annotation_files:
      - /mnt/nfs_shared_data/dataset/ssv2/labels/train.json
      - /mnt/nfs_shared_data/dataset/ssv2/labels/validation.json
      - /mnt/nfs_shared_data/dataset/ssv2/labels/test.json
      - /mnt/nfs_shared_data/dataset/ssv2/labels/labels.json
      - /mnt/nfs_shared_data/dataset/ssv2/labels/test-answers.csv
    media_dirs:
      - /mnt/nfs_shared_data/dataset/ssv2/20bn-something-something-v2
    media_extensions: [.webm]
    license_record: inputs/licenses/something_something_v2.accepted.json
  audioset_strong:
    enabled: true
    resource_name: audioset_strong_annotations
    annotation_files:
      - /mnt/nfs_shared_data/dataset/deltaomni/audioset_strong/annotations/audioset_train_strong.tsv
      - /mnt/nfs_shared_data/dataset/deltaomni/audioset_strong/annotations/audioset_eval_strong.tsv
      - /mnt/nfs_shared_data/dataset/deltaomni/audioset_strong/annotations/mid_to_display_name.tsv
    media_dirs:
      - /mnt/nfs_shared_data/dataset/omniembed/audioset/balanced_train_segments/audio
      - /mnt/nfs_shared_data/dataset/omniembed/audioset/unbalanced_train_segments/audio
      - /mnt/nfs_shared_data/dataset/omniembed/audioset_unbalanced_more/audio
      - /mnt/nfs_shared_data/dataset/omniembed/audioset/eval_segments/audio
    media_extensions: [.wav, .flac, .mp4]
    license_record: inputs/licenses/audioset_media.accepted.json
  nextqa:
    enabled: true
    resource_name: nextqa_annotations
    annotation_files:
      - /mnt/nfs_shared_data/dataset/deltaomni/nextqa/annotations/train.csv
      - /mnt/nfs_shared_data/dataset/deltaomni/nextqa/annotations/val.csv
      - /mnt/nfs_shared_data/dataset/deltaomni/nextqa/annotations/test.csv
      - /mnt/nfs_shared_data/dataset/deltaomni/nextqa/annotations/map_vid_vidorID.json
    media_dirs:
      - /mnt/nfs_shared_data/dataset/NExT-QA/processed_for_gcg/NExTVideo
    media_extensions: [.mp4, .webm]
    media_policy: configs/nextqa_media_policy.yaml
  msrvtt:
    enabled: true
    resource_name: msrvtt_annotations
    annotation_files:
      - /mnt/nfs_shared_data/dataset/omniembed/MSRVTT/metadata/train.json
      - /mnt/nfs_shared_data/dataset/omniembed/MSRVTT/metadata/val.json
      - /mnt/nfs_shared_data/dataset/omniembed/MSRVTT/metadata/test.json
    media_dirs:
      - /mnt/nfs_shared_data/dataset/omniembed/MSRVTT/videos
    media_extensions: [.mp4]
    media_policy: configs/msrvtt_media_policy.yaml
  ego4d_goalstep:
    enabled: true
    resource_name: ego4d
    annotation_files:
      - /mnt/nfs_shared_data/dataset/ego4d_540/v2_annotations/v2/annotations/goalstep_train.json
      - /mnt/nfs_shared_data/dataset/ego4d_540/v2_annotations/v2/annotations/goalstep_val.json
      - /mnt/nfs_shared_data/dataset/ego4d_540/v2_annotations/ego4d.json
    media_dirs:
      - /mnt/nfs_shared_data/dataset/ego4d_540/v2/video_540ss
    media_extensions: [.mp4]
    license_record: inputs/licenses/ego4d.accepted.json
