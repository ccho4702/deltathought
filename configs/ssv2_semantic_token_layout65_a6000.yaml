seed: 42
initialization: random
ssv2_config: configs/ssv2_semantic_scaled_layout65.yaml
semantic_config: configs/ssv2_semantic_pilot.yaml
runtime:
  device: cuda
  backend: nccl
  precision: bfloat16
  per_device_batch_size: 32
  gradient_accumulation_steps: 1
  num_workers: 4
  cpu_threads: 8
  tf32: true
  nccl_compatibility_mode: true
token:
  hidden_dim: 512
  token_count: 1
  codebook_size: 16
  num_heads: 8
  temperature_start: 1.0
  temperature_end: 0.2
  semantic_weight: 1.0
  reconstruction_weight: 1.0
  sample_entropy_weight: 0.01
  usage_entropy_weight: 0.05
learning_rate: 0.0001
weight_decay: 0.01
max_steps: 800
checkpoint_interval_steps: 50
evaluation_batch_size: 32
evaluation_split: validation
shuffle_repeats: 8
minimum_accuracy_gap: 0.05
minimum_effective_codes: 3.0
resume: auto
output_root: outputs/real_pilots/ssv2_semantic_token_layout65
log_root: logs/experiments
