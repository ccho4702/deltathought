seed: 42
modality: video
cache_manifest: intermediates/cache/omni_vggsound_s1_2s_224/video_manifest.json
runtime:
  device: cuda
  backend: nccl
  nccl_compatibility_mode: true
  precision: bfloat16
  cpu_threads: 4
  per_device_batch_size: 8
  gradient_accumulation_steps: 4
  cache_entries: 512
model:
  input_dim: 3584
  model_dim: 768
  tokens_per_frame: 128
  delta_tokens: 1
  depth: 12
  num_heads: 12
training:
  learning_rate: 0.001
  weight_decay: 0.0001
  # 2,000 x global batch 128 / 18,067 train pairs = 14.2 passes, close to the
  # paper's 50,000 x 1,024 / roughly 4M samples = 12.8 passes.
  warmup_steps: 200
  max_steps: 2000
  checkpoint_interval_steps: 200
  keep_last_checkpoints: 2
  gradient_clip_norm: 0.01
  resume: auto
evaluation:
  batch_size: 8
  retrieval_limit: 1024
  minimum_mse_relative_improvement: 0.01
  minimum_retrieval_absolute_improvement: 0.01
output_root: outputs/real_pilots/deltatok_vggsound_video
log_root: logs/experiments
