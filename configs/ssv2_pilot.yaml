seed: 42
device: cuda:0
cpu_threads: 4
media_dir: /mnt/nfs_shared_data/dataset/ssv2/20bn-something-something-v2
access_mode: read_only_existing_shared_copy
train_annotations: /mnt/nfs_shared_data/dataset/ssv2/labels/train.json
validation_annotations: /mnt/nfs_shared_data/dataset/ssv2/labels/validation.json
classes:
  - Moving [something] down
  - Moving [something] up
  - Pushing [something] from left to right
  - Pushing [something] from right to left
train_per_class: 8
validation_per_class: 4
frames_per_clip: 4
embedding_batch_size: 16
cache_root: intermediates/cache/ssv2_pilot
output_root: outputs/real_pilots/ssv2
model:
  embedding_dim: 768
  embedding_tokens: 257
  delta_tokens: 8
  hidden_dim: 256
  num_heads: 8
training:
  batch_size: 4
  learning_rate: 0.001
  max_steps: 100
  checkpoint_interval_steps: 25
  max_grad_norm: 1.0
probe:
  steps: 200
  learning_rate: 0.01
  hidden_dim: 64
caption:
  prompt: "Classify the visual change. Answer with exactly one action label: "
  targets:
    - "moving down"
    - "moving up"
    - "pushing left to right"
    - "pushing right to left"
  learning_rate: 0.005
  max_steps: 120
  checkpoint_interval_steps: 40
  ranking_weight: 1.0
